<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artículos de Limpieza · Bienvenido</title>
<style>
  :root{
    --ink:#0f2c4d;
    --accent:#1a4f8b;
    --accent2:#25D366;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.10) 0, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,.08) 0, transparent 45%),
      linear-gradient(160deg,#0f2c4d 0%, #1a4f8b 55%, #2c6bb0 100%);
    color:#fff;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* ---- Texto de marca ---- */
  .brand{
    text-align:center;
    z-index:5;
    opacity:0;
    animation: fadeUp 900ms ease-out 200ms forwards;
    padding:0 20px;
  }
  .brand .eyebrow{
    display:inline-block;
    font-size:13px; letter-spacing:3px; text-transform:uppercase; font-weight:800;
    color:#0f2c4d; background:#ffd400; padding:6px 16px; border-radius:20px;
    margin-bottom:14px;
  }
  .brand h1{
    font-size:clamp(26px, 6vw, 46px);
    font-weight:900;
    margin:0 0 10px;
    line-height:1.15;
  }
  .brand h1 span{ color:#8fd1ff; }
  .brand p{
    font-size:clamp(13px, 2.6vw, 17px);
    color:#dce8f7;
    max-width:520px;
    margin:0 auto;
    line-height:1.5;
  }

  /* ---- Carrusel de fotos ---- */
  .stage{
    position:relative;
    width:min(78vw, 340px);
    height:min(78vw, 340px);
    margin:28px auto 10px;
    z-index:5;
  }
  .stage img{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    object-fit:contain;
    border-radius:20px;
    background:#ffffff;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
    opacity:0;
    transform:scale(.92) rotate(-2deg);
    animation: photoCycle 7.5s infinite;
  }
  .stage img:nth-child(1){ animation-delay:0s; }
  .stage img:nth-child(2){ animation-delay:1.5s; }
  .stage img:nth-child(3){ animation-delay:3s; }
  .stage img:nth-child(4){ animation-delay:4.5s; }
  .stage img:nth-child(5){ animation-delay:6s; }

  @keyframes photoCycle{
    0%{ opacity:0; transform:scale(.92) rotate(-2deg); }
    4%{ opacity:1; transform:scale(1) rotate(0deg); }
    18%{ opacity:1; transform:scale(1) rotate(0deg); }
    24%{ opacity:0; transform:scale(1.05) rotate(2deg); }
    100%{ opacity:0; }
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---- Sello calidad ---- */
  .quality{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    margin-top:14px; z-index:5;
    opacity:0;
    animation: fadeUp 900ms ease-out 500ms forwards;
  }
  .quality span{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.35);
    border-radius:20px;
    padding:6px 14px;
    font-size:12.5px;
    font-weight:700;
  }

  /* ---- Loader / progreso ---- */
  .loader-wrap{
    margin-top:30px;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    opacity:0;
    animation: fadeUp 900ms ease-out 800ms forwards;
  }
  .bar{
    width:180px; height:6px; border-radius:6px;
    background:rgba(255,255,255,.2);
    overflow:hidden;
  }
  .bar-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg,#ffd400,#8fd1ff);
    border-radius:6px;
    animation: fill 10s linear forwards;
  }
  @keyframes fill{ from{width:0%;} to{width:100%;} }
  .loader-text{ font-size:12px; color:#bcd2ec; }

  .skip{
    margin-top:18px; z-index:5;
    background:#ffffff; color:#0f2c4d; border:none; border-radius:12px;
    padding:11px 22px; font-size:13.5px; font-weight:800; cursor:pointer;
    opacity:0;
    animation: fadeUp 900ms ease-out 1000ms forwards;
  }

  /* ---- Burbujas decorativas ---- */
  .bubble{
    position:absolute; border-radius:50%;
    background:rgba(255,255,255,.06);
    animation: float 9s ease-in-out infinite;
  }
  .b1{ width:160px; height:160px; top:-40px; left:-50px; animation-delay:0s; }
  .b2{ width:220px; height:220px; bottom:-70px; right:-60px; animation-delay:1.5s; }
  .b3{ width:90px; height:90px; top:20%; right:6%; animation-delay:3s; }
  @keyframes float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-18px); }
  }
</style>
</head>
<body>

  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>

  <div class="brand">
    <span class="eyebrow">Industria Payador</span>
    <h1>Calidad que se <span>nota en cada lavado</span></h1>
    <p>Jabones líquidos, suavizantes, detergentes y desinfectantes envasados con los más altos estándares de calidad.</p>
  </div>

  <div class="stage">
    <img src="producto-jabon-liquido.jpg" alt="Jabón líquido para ropa">
    <img src="producto-suavizantes.jpg" alt="Suavizantes de ropa">
    <img src="producto-detergente-amarillo.jpg" alt="Detergente lavavajillas">
    <img src="producto-detergente-verde.jpg" alt="Detergente lavavajillas verde">
    <img src="producto-desinfectantes.jpg" alt="Desinfectantes">
  </div>

  <div class="quality">
    <span>✅ Envasado en fábrica</span>
    <span>🧪 Fórmulas de calidad</span>
    <span>🚚 Envío incluido</span>
  </div>

  <div class="loader-wrap">
    <div class="bar"><div class="bar-fill"></div></div>
    <div class="loader-text">Ingresando al catálogo...</div>
  </div>

  <button class="skip" onclick="goToStore()">Ingresar ahora</button>

<script>
  function goToStore(){
    window.location.href = "publico_mayorista.html";
  }
  setTimeout(goToStore, 10000);
</script>

</body>
</html>
